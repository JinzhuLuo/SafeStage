[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "safe-stage"
version = "0.2.0"
description = "92 portable manipulation scenes with task goals, safety prompt conditions, and violation evaluation"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
evaluation = ["numpy>=1.24,<3"]
usd = ["usd-core>=24.3"]

[project.scripts]
safe-stage = "safe_stage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true

